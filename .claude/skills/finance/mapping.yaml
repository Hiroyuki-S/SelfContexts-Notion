# マネーフォワードME の「大項目」から、Notion「📈 家計サマリー（月次）」の列への対応表。
#
# 【重要】MFはユーザーが項目を追加・改名できる。この表は標準項目を前提に書いてあるので、
# 実際のCSVに未知の大項目が出たら aggregate.py が警告を出す。出たらこのファイルに追記する。
# 勝手に「その他」へ寄せない。寄せると支出の中身が見えなくなり、要因分析ができなくなる。

# CSVの列名（MFの標準的な書き出し）
csv_columns:
  target: 計算対象     # 1 のみ集計。0 は本人が集計対象外にしたもの
  date: 日付
  content: 内容
  amount: 金額（円）    # プラス=収入、マイナス=支出
  institution: 保有金融機関
  major: 大項目
  minor: 中項目
  memo: メモ
  transfer: 振替       # 1 は自分の口座間の移動。収入でも支出でもないので必ず除外する
  id: ID

income:
  給与: 給与
  賞与: 賞与
  配当所得: 配当
  不動産所得: 家賃収入
  事業・副業: その他収入
  年金: その他収入
  一時所得: その他収入
  その他入金: その他収入
  収入: その他収入

expense:
  住宅: 住居費
  水道・光熱費: 水道光熱費
  通信費: 通信費
  保険: 保険
  教育: 教育費
  食費: 食費
  日用品: 日用品
  交通費: 交通費
  自動車: 交通費
  趣味・娯楽: 娯楽・交際費
  交際費: 娯楽・交際費
  税・社会保障: 税・社会保険
  衣服・美容: その他支出
  健康・医療: その他支出
  特別な支出: その他支出
  その他: その他支出

# 集計から完全に除外する大項目。
# 「現金・カード」はATM出金やカード引き落としで、振替フラグが立たない場合がある。
# これを支出に数えると二重計上になる（出金と、そのお金で買った物の両方を数えてしまう）。
exclude:
  - 現金・カード
  - 振替
