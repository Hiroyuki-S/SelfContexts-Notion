# 利用店名から支出カテゴリを判定するルール。
#
# dカードの明細には「カテゴリ」列が無く、店名しか手がかりがない。
# 下のキーワードを店名に含むかどうかで判定する（上から順に最初に当たったものを採用）。
# 判定できなかった店は集計されるが「未分類」として金額つきで報告される。放置しない。
#
# 照合の前に全角→半角の正規化（NFKC）と大文字化を行う。ＥＮＥＯＳ と ENEOS は同じ。

# 完全一致でしか判定できない店。部分一致だと別の店を巻き込むものはここに書く。
# 例：「三好店」を部分一致にすると「ベイシア三好店」（食費）まで交通費になってしまう。
# 正規化後の店名と完全に一致したときだけ採用し、下の rules より先に評価する。
exact_rules:
  - category: 交通費
    stores: ["ｄ払いＢ／三好店", "ｄ払いＢ／ＡＣ長久手"]

rules:
  # --- 副業経費 ---
  # 生活費ではないので必ず分ける。混ぜると不労所得カバー率の分母が膨らみ、
  # 到達予測年が実際より遠く出てしまう。
  - category: 副業経費
    keywords: [LINK CO., LTDLTD, LINKCO]

  # --- 通信費 ---
  - category: 通信費
    keywords: [ドコモゴリヨウリョウキン, ドコモケッサイ, ドコモご利用料金, ドコモ決済, UQMOBILE, UQモバイル, NTT, SOFTBANK, AUKDDI, ラクテンモバイル]

  # --- 水道光熱費 ---
  - category: 水道光熱費
    keywords: [ドコモでんき, ドコモテ゛ンキ, トウホウガス, 東邦ガス, 中部電力, デンリョク, スイドウ, 水道]

  # --- 交通費（ガソリン・高速・交通系IC・自動車） ---
  - category: 交通費
    keywords: [ENEOS, アポロステーシヨン, アポロステーション, ウサミ, 宇佐美, セルフ, ユニー・オイル, ユニーオイル, SHELL, コスモセキユ, 出光]
  - category: 交通費
    keywords: [国見SA, ETC, NEXCO, コウソクドウロ, 後納切替, モバイルスイカ, SUICA, PASMO, ICOCA, JR, タクシー, 駐車場, パーキング]
  - category: 交通費
    keywords: [トヨタ, ニッサン, ホンダ, オートバックス, イエローハット, 車検, ジドウシャ]

  # --- 教育費 ---
  - category: 教育費
    keywords: [Z会, ゼットカイ, ベネッセ, 進研, 塾, ジュク, スクール, ゼミ, 学研, コウザ]

  # --- 医療・美容・理容 ---
  # 店名が具体的なので、スーパー名より先に評価する。順番を変えると
  # 「サンキューカット　ベイシア三好店」が「ベイシア」に当たって食費になってしまう。
  - category: その他支出
    keywords: [クリニック, 歯科, 病院, 薬局, ヤッキョク, 医院, カウンセリング, リゼ, ブレスマイル, ネイルコウボウ, サンキューカット, サンキユーカツト]

  # --- 食費（スーパー・コンビニ・外食） ---
  # ニホンアムウエイは食品と雑貨が混在する。分けられないので食費に寄せている。
  # 雑貨の比率が高いと感じたら、この行を日用品側に移すだけでよい。
  - category: 食費
    keywords: [ニホンアムウエイ, アムウエイ, ベイシア, ピアゴ, ヨークベニマル, バロー, カネスエ, 西友, マルエツ, フェルナ, ツルヤ, シャトレーゼ, トーヨーベンディング, えぷろん, エプロン, ユーストア, メグリア, グリーンセンター, イオン, ライフ, 業務スーパー, コストコ]
  - category: 食費
    keywords: [ローソン, ファミリーマート, セブンイレブン, ミニストップ, デイリーヤマザキ, ポプラ, サンクス]
  - category: 食費
    keywords: [かっぱ寿司, ジョイフル, ピツツエリア, ピッツェリア, ミスタート゛ーナツ, ミスタードーナツ, マクドナルド, スターバックス, ドトール, ガスト, サイゼリヤ, コメダ, 屋台村, ドラヤキ, どら焼き, レストラン, 食堂]

  # --- 日用品 ---
  - category: 日用品
    keywords: [セリア, ダイソー, キャンドゥ, ダイソー, 無印良品, ムジルシ, ニトリ, DCM, カインズ, コーナン, ホームセンター]
  - category: 日用品
    keywords: [クスリノアオキ, クスリのアオキ, ドラッグ, ト゛ラック゛, ドラツグ, マツモトキヨシ, ウエルシア, スギヤマ, ツルハ, VドラッグA, Vドラツグ]

  # --- 娯楽・交際費 ---
  - category: 娯楽・交際費
    keywords: [アソビュー, どんぐりの湯, ドングリノユ, 恵みの湯, AGODA, ジャラン, ジヤラン, 温泉, スパ, 映画, シネマ, TOHO, イベント, チケット, ゴルフ, カラオケ]

  # --- その他支出（サブスク・医療・美容・衣服・家電など） ---
  - category: その他支出
    keywords: [ANTHROPIC, CLAUDE, GOOGLE, APPLE, AMAZON, AMAZONプライム, NETFLIX, SPOTIFY, ADOBE, MICROSOFT, OPENAI, SUNO, SALON.JP]
  - category: その他支出
    keywords: [エイチアールシー, バースデイ, ユニクロ, UNIQLO, GU, しまむら, ヌノナ, ILLUSIE, コロリス, COLORIS, エンジェルルナ]
  - category: その他支出
    keywords: [ヤマダデンキ, ヤマタ゛テ゛ンキ, ビックカメラ, ヨドバシ, エディオン, ケーズデンキ]

# 完全に除外する行（カードの内部処理など。支出ではない）
exclude_keywords:
  - キャッシング
  - リボ手数料
  - 年会費返金
